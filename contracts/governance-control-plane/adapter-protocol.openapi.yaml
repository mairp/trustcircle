openapi: 3.1.0
info:
  title: TrustCircleAI Adapter Sidecar Protocol
  version: 1.0.0
  description: >
    Language-neutral protocol between the TrustCircleAI adapter runner and an
    out-of-process source/controller adapter. The adapter cannot access the canonical
    database and receives a tenant/source-scoped workload identity.
servers:
  - url: https://adapter.internal.invalid
security:
  - workloadIdentity: []
paths:
  /v1/adapter/manifest:
    get:
      operationId: getAdapterManifest
      responses:
        '200':
          description: Signed adapter manifest
          content:
            application/json:
              schema:
                $ref: './adapter-manifest.schema.json'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/discover:
    post:
      operationId: discoverSources
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [boundary_version, scope, metadata_only]
              properties:
                boundary_version: { type: string, format: uuid }
                scope: { type: object }
                metadata_only: { const: true }
                cursor: { type: [string, 'null'] }
                limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
      responses:
        '200':
          description: Source candidates and explicit scan gaps
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DiscoveryPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/snapshot:
    post:
      operationId: getSourceSnapshot
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_instance_id, scope]
              properties:
                source_instance_id: { type: string, format: uuid }
                scope: { type: object }
                cursor: { type: [string, 'null'] }
                limit: { type: integer, minimum: 1, maximum: 1000, default: 100 }
                as_of: { type: [string, 'null'], format: date-time }
      responses:
        '200':
          description: Versioned source observations and coverage metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ObservationPage'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/items/{externalId}:
    get:
      operationId: inspectSourceItem
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SourceInstanceId'
        - name: externalId
          in: path
          required: true
          schema: { type: string, minLength: 1 }
        - name: expected_revision
          in: query
          schema: { type: string }
      responses:
        '200':
          description: Current source observation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SourceObservation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/simulations:
    post:
      operationId: simulateSourceOperation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperationRequest'
      responses:
        '200':
          description: Non-mutating simulation bound to source revision and adapter version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SimulationResult'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/operations:
    post:
      operationId: executeSourceOperation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              allOf:
                - $ref: '#/components/schemas/OperationRequest'
                - type: object
                  required:
                    - trustcircle_operation_id
                    - policy_decision_id
                    - evidence_plan
                    - stop_conditions
                    - rollback_plan
                  properties:
                    trustcircle_operation_id: { type: string, format: uuid }
                    policy_decision_id: { type: string, format: uuid }
                    decision_package_digest: { type: [string, 'null'] }
                    evidence_plan: { type: object }
                    stop_conditions:
                      type: array
                      minItems: 1
                      items: { type: object }
                    rollback_plan: { type: object }
      responses:
        '202':
          description: Source operation accepted or prior idempotent result returned
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        '200':
          description: Synchronously confirmed or rejected source operation
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/operations/{adapterOperationId}:
    get:
      operationId: getSourceOperation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: adapterOperationId
          in: path
          required: true
          schema: { type: string }
      responses:
        '200':
          description: Adapter operation and observed source outcome
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/operations/{adapterOperationId}/actions:
    post:
      operationId: controlSourceOperation
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - name: adapterOperationId
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, trustcircle_operation_id, policy_decision_id, reason]
              properties:
                action:
                  enum: [pause, resume, rollback, cancel]
                trustcircle_operation_id: { type: string, format: uuid }
                policy_decision_id: { type: string, format: uuid }
                expected_source_revision: { type: [string, 'null'] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Current adapter operation after the control request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        '202':
          description: Control request accepted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/reconciliation-runs:
    post:
      operationId: reconcileSource
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_instance_id, mode, scope, reason]
              properties:
                source_instance_id: { type: string, format: uuid }
                mode:
                  enum: [inspect_only, compare, verify_operation, repair_projection]
                scope: { type: object }
                trustcircle_operation_id: { type: [string, 'null'], format: uuid }
                expected_cursor: { type: [string, 'null'] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Synchronous reconciliation result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReconciliationResult'
        '202':
          description: Reconciliation accepted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/evidence:
    post:
      operationId: collectSourceEvidence
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [source_instance_id, scope, evidence_type, classification, reason]
              properties:
                source_instance_id: { type: string, format: uuid }
                scope: { type: object }
                evidence_type: { type: string }
                classification: { type: string }
                expected_source_revision: { type: [string, 'null'] }
                reason: { $ref: '#/components/schemas/Reason' }
      responses:
        '200':
          description: Evidence metadata and content digest; body transfer is deployment-specific
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EvidenceCapture'
        '202':
          description: Evidence collection accepted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterOperation'
        default:
          $ref: '#/components/responses/Problem'
  /v1/adapter/health:
    get:
      operationId: getAdapterHealth
      security: []
      responses:
        '200':
          description: Non-sensitive liveness
          content:
            application/json:
              schema:
                type: object
                required: [status, adapter_version, observed_at]
                properties:
                  status: { enum: [healthy, degraded, unavailable] }
                  adapter_version: { type: string }
                  observed_at: { type: string, format: date-time }
        '503':
          $ref: '#/components/responses/Problem'
  /v1/adapter/readiness:
    get:
      operationId: getAdapterReadiness
      parameters:
        - $ref: '#/components/parameters/TenantId'
        - $ref: '#/components/parameters/SourceInstanceId'
      responses:
        '200':
          description: Non-mutating dependency, authority, cursor, and failure readiness
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterReadiness'
        '503':
          description: Not ready; safe next actions and affected scope included
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdapterReadiness'
components:
  securitySchemes:
    workloadIdentity:
      type: mutualTLS
  parameters:
    TenantId:
      name: X-Tenant-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    SourceInstanceId:
      name: X-Source-Instance-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      schema:
        type: string
        minLength: 8
        maxLength: 128
    CorrelationId:
      name: X-Correlation-ID
      in: header
      required: true
      schema: { type: string, format: uuid }
  responses:
    Problem:
      description: Adapter problem
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
  schemas:
    Reason:
      type: object
      additionalProperties: false
      required: [code, text]
      properties:
        code: { type: string, minLength: 1, maxLength: 80 }
        text: { type: string, minLength: 3, maxLength: 4000 }
    SourceCandidate:
      type: object
      additionalProperties: false
      required:
        - candidate_id
        - source_class
        - observed_location
        - stable_fingerprint
        - access_state
        - sensitivity
        - observed_at
        - discovery_evidence
      properties:
        candidate_id: { type: string }
        source_class: { type: string }
        observed_location: { type: string }
        stable_fingerprint: { type: [string, 'null'] }
        access_state:
          enum: [metadata_only, read_authorized, write_authorized, denied, unknown]
        sensitivity:
          enum: [public, internal, confidential, restricted, unknown]
        owner_hint: { type: [string, 'null'] }
        capability_hints:
          type: array
          uniqueItems: true
          items: { type: string }
        observed_at: { type: string, format: date-time }
        discovery_evidence:
          $ref: '#/components/schemas/EvidenceCapture'
    ScanGap:
      type: object
      required: [scope, reason, observed_at]
      properties:
        scope: { type: object }
        reason: { type: string }
        observed_at: { type: string, format: date-time }
        safe_next_action: { type: string }
    DiscoveryPage:
      type: object
      required: [items, scan_gaps, next_cursor, complete]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceCandidate' }
        scan_gaps:
          type: array
          items: { $ref: '#/components/schemas/ScanGap' }
        next_cursor: { type: [string, 'null'] }
        complete: { type: boolean }
    SourceObservation:
      type: object
      additionalProperties: false
      required:
        - schema_version
        - observation_id
        - tenant_id
        - source_instance_id
        - external_type
        - external_id
        - source_revision
        - occurred_at
        - observed_at
        - mapping_version
        - raw_evidence
        - normalized
        - integrity_state
      properties:
        schema_version: { const: 1.0.0 }
        observation_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        source_instance_id: { type: string, format: uuid }
        external_type: { type: string }
        external_id: { type: string }
        source_revision: { type: string }
        aggregate_sequence: { type: [integer, 'null'], minimum: 0 }
        occurred_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        ordering_uncertain: { type: boolean, default: false }
        mapping_version: { type: string }
        tombstone: { type: boolean, default: false }
        raw_evidence:
          $ref: '#/components/schemas/EvidenceCapture'
        normalized: { type: object }
        source_extensions: { type: object }
        integrity_state:
          enum: [unchecked, valid, suspect, quarantined]
    ObservationPage:
      type: object
      required: [items, next_cursor, snapshot_cursor, complete, coverage_gaps]
      properties:
        items:
          type: array
          items: { $ref: '#/components/schemas/SourceObservation' }
        next_cursor: { type: [string, 'null'] }
        snapshot_cursor: { type: string }
        complete: { type: boolean }
        coverage_gaps:
          type: array
          items: { $ref: '#/components/schemas/ScanGap' }
    OperationRequest:
      type: object
      additionalProperties: false
      required:
        - source_instance_id
        - external_type
        - external_id
        - operation_type
        - expected_source_revision
        - requested_change
        - scope
        - reason
      properties:
        source_instance_id: { type: string, format: uuid }
        external_type: { type: string }
        external_id: { type: string }
        operation_type: { type: string }
        expected_source_revision: { type: string }
        requested_change: { type: object }
        scope: { type: object }
        reason: { $ref: '#/components/schemas/Reason' }
        simulation_id: { type: [string, 'null'], format: uuid }
    SimulationResult:
      type: object
      additionalProperties: false
      required:
        - simulation_id
        - adapter_version
        - source_revision
        - predicted_changes
        - affected_scope
        - risks
        - preconditions
        - evidence_plan
        - stop_conditions
        - rollback
        - generated_at
        - expires_at
      properties:
        simulation_id: { type: string, format: uuid }
        adapter_version: { type: string }
        source_revision: { type: string }
        predicted_changes: { type: array, items: { type: object } }
        affected_scope: { type: object }
        risks: { type: array, items: { type: object } }
        preconditions: { type: array, items: { type: object } }
        evidence_plan: { type: object }
        stop_conditions: { type: array, items: { type: object } }
        rollback: { type: object }
        generated_at: { type: string, format: date-time }
        expires_at: { type: string, format: date-time }
    AdapterOperation:
      type: object
      additionalProperties: false
      required:
        - adapter_operation_id
        - trustcircle_operation_id
        - tenant_id
        - source_instance_id
        - operation_type
        - request_digest
        - status
        - outcome
        - started_at
        - evidence
      properties:
        adapter_operation_id: { type: string }
        trustcircle_operation_id: { type: string, format: uuid }
        tenant_id: { type: string, format: uuid }
        source_instance_id: { type: string, format: uuid }
        operation_type: { type: string }
        request_digest:
          type: string
          pattern: '^[a-f0-9]{64}$'
        status:
          enum: [accepted, executing, paused, reconciling, completed, failed, cancelled]
        outcome:
          enum:
            - none
            - confirmed
            - duplicate
            - rejected
            - conflict
            - pending_reconciliation
            - failed
            - rolled_back
            - rollback_failed
        resulting_source_revision: { type: [string, 'null'] }
        observed_state: { type: [object, 'null'] }
        started_at: { type: string, format: date-time }
        completed_at: { type: [string, 'null'], format: date-time }
        last_safe_checkpoint: { type: [string, 'null'] }
        retry_after_seconds: { type: [integer, 'null'], minimum: 0 }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceCapture' }
        failure:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
    ReconciliationResult:
      type: object
      required:
        - reconciliation_id
        - source_instance_id
        - snapshot_cursor
        - observed_state
        - drift
        - outcome
        - evidence
        - completed_at
      properties:
        reconciliation_id: { type: string, format: uuid }
        source_instance_id: { type: string, format: uuid }
        snapshot_cursor: { type: string }
        observed_state: { type: object }
        drift:
          type: array
          items:
            type: object
            required: [class, scope]
            properties:
              class:
                enum: [missing, duplicate, stale, conflicting, orphaned, schema_incompatible, unknown]
              scope: { type: object }
              repair_eligible: { type: boolean }
        outcome:
          enum: [reconciled, drift_found, partial, failed, indeterminate]
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceCapture' }
        completed_at: { type: string, format: date-time }
    EvidenceCapture:
      type: object
      additionalProperties: false
      required: [capture_id, sha256, size_bytes, media_type, observed_at, classification]
      properties:
        capture_id: { type: string, format: uuid }
        sha256:
          type: string
          pattern: '^[a-f0-9]{64}$'
        size_bytes: { type: integer, minimum: 0 }
        media_type: { type: string }
        observed_at: { type: string, format: date-time }
        classification: { type: string }
        transfer_uri: { type: [string, 'null'], format: uri-reference }
        source_revision: { type: [string, 'null'] }
    AdapterReadiness:
      type: object
      required:
        - status
        - adapter_id
        - adapter_version
        - contract_version
        - owner
        - dependencies
        - last_attempt
        - last_success
        - cursor
        - retry
        - affected_scope
        - evidence
        - safe_next_actions
        - observed_at
      properties:
        status: { enum: [healthy, degraded, unavailable, unknown] }
        adapter_id: { type: string }
        adapter_version: { type: string }
        contract_version: { type: string }
        owner: { type: string }
        dependencies: { type: array, items: { type: object } }
        last_attempt: { type: [string, 'null'], format: date-time }
        last_success: { type: [string, 'null'], format: date-time }
        cursor: { type: [string, 'null'] }
        retry: { type: object }
        affected_scope: { type: object }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/EvidenceCapture' }
        failure:
          oneOf:
            - $ref: '#/components/schemas/Problem'
            - type: 'null'
        safe_next_actions:
          type: array
          items: { type: string }
        observed_at: { type: string, format: date-time }
    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, detail, correlation_id, retryable, dispatch_state, safe_next_actions]
      properties:
        type: { type: string, format: uri }
        title: { type: string }
        status: { type: integer, minimum: 400, maximum: 599 }
        code:
          enum:
            - unauthenticated
            - unauthorized
            - policy_denied
            - invalid_request
            - invalid_contract
            - unsupported_contract
            - precondition_failed
            - conflict
            - rate_limited
            - transient
            - dependency_unavailable
            - timeout
            - rollback_failed
            - verification_failed
        detail: { type: string }
        correlation_id: { type: string, format: uuid }
        retryable: { type: boolean }
        dispatch_state:
          enum: [not_dispatched, dispatched, unknown]
        retry_after_seconds: { type: [integer, 'null'], minimum: 0 }
        safe_next_actions:
          type: array
          items: { type: string }
