    metadata: { labels: { app.kubernetes.io/name: command-worker } }
    spec:
      securityContext: { runAsNonRoot: false }
      terminationGracePeriodSeconds: 30
      containers:
        - name: command-worker
          image: trustcircle/command-worker:local
          envFrom: [{ configMapRef: { name: trustcircle-core-env } }]
          env:
            - { name: SERVICE_NAME, value: 'command-worker' }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: trustcircle-secrets, key: DATABASE_URL } }
            - { name: OBJECT_STORE_ACCESS_KEY, value: trustcircle }
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                { secretKeyRef: { name: trustcircle-secrets, key: OBJECT_STORE_SECRET_KEY } }
          readinessProbe:
            exec:
              {
                command:
                  [
                    'node',
                    '/app/deploy/compose/healthcheck.mjs',
                    'file:///app/.health/command-worker',
                  ],
              }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              {
                command:
                  [
                    'node',
                    '/app/deploy/compose/healthcheck.mjs',
                    'file:///app/.health/command-worker',
                  ],
              }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
