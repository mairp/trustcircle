# Application tiers (startupIndex 5-9). Images are placeholders `trustcircle/<tier>:local`;
# scripts/provision.sh rewrites them to the consumer's registry/tag in the generated overlay.
# Pods fail closed: an app whose prerequisites are unhealthy reports not-ready and is restarted,
# matching the compose profile's `service_healthy` edges (NFR-010).
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: api }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: api } }
  template:
    metadata: { labels: { app.kubernetes.io/name: api } }
    spec:
      securityContext: { runAsNonRoot: false }
      terminationGracePeriodSeconds: 30
      containers:
        - name: api
          image: trustcircle/api:local
          envFrom: [{ configMapRef: { name: trustcircle-core-env } }]
          env:
            - { name: SERVICE_NAME, value: 'api' }
            - { name: API_PORT, value: '3000' }
            - name: DATABASE_URL
              valueFrom: { secretKeyRef: { name: trustcircle-secrets, key: DATABASE_URL } }
            - { name: OBJECT_STORE_ACCESS_KEY, value: trustcircle }
            - name: OBJECT_STORE_SECRET_KEY
              valueFrom:
                { secretKeyRef: { name: trustcircle-secrets, key: OBJECT_STORE_SECRET_KEY } }
          ports: [{ containerPort: 3000 }]
          readinessProbe:
            exec:
              {
                command:
                  [
                    'node',
                    '/app/deploy/compose/healthcheck.mjs',
                    'http://localhost:3000/v1/health',
                  ],
              }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              {
                command:
                  [
                    'node',
                    '/app/deploy/compose/healthcheck.mjs',
                    'http://localhost:3000/v1/health',
                  ],
              }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: { name: api }
spec:
  selector: { app.kubernetes.io/name: api }
  ports: [{ name: http, port: 3000, targetPort: 3000 }]
---
apiVersion: apps/v1
