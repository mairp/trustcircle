apiVersion: apps/v1
kind: Deployment
metadata: { name: web }
spec:
  replicas: 2
  selector: { matchLabels: { app.kubernetes.io/name: web } }
  template:
    metadata: { labels: { app.kubernetes.io/name: web } }
    spec:
      securityContext: { runAsNonRoot: true }
      terminationGracePeriodSeconds: 30
      containers:
        - name: web
          image: trustcircle/web:local
          envFrom: [{ configMapRef: { name: trustcircle-core-env } }]
          env:
            - { name: SERVICE_NAME, value: 'web' }
            - { name: API_BASE_URL, value: 'http://api:3000' }
            - { name: PORT, value: '8080' }
            - { name: HOSTNAME, value: '0.0.0.0' }
            - { name: TRUST_IDENTITY_HEADERS, value: 'false' }
          ports: [{ containerPort: 8080 }]
          readinessProbe:
            exec:
              {
                command:
                  ['node', '/app/deploy/compose/healthcheck.mjs', 'http://localhost:8080/healthz'],
              }
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            exec:
              {
                command:
                  ['node', '/app/deploy/compose/healthcheck.mjs', 'http://localhost:8080/healthz'],
              }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
---
apiVersion: v1
kind: Service
metadata: { name: web }
spec:
