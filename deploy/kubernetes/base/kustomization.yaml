# deploy/kubernetes/base — core-only control-plane profile for Kubernetes.
#
# Mirrors deploy/compose/control-plane.yml (the ten `core-required` components of
# deploy/profiles/components.yaml). The base is namespace-agnostic and carries NO secret
# values: scripts/provision.sh creates, per consumer, the namespace, the
# `trustcircle-secrets` Secret, and the `trustcircle-migrations` / `trustcircle-otel` /
# `trustcircle-nats-topology` ConfigMaps from the checked-in sources, then applies a
# generated overlay that sets the namespace and image references.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

labels:
  - includeSelectors: false
    pairs:
      app.kubernetes.io/part-of: trustcircle

configMapGenerator:
  - name: trustcircle-core-env
    options:
      disableNameSuffixHash: true
    literals:
      - NATS_URL=nats://nats:4222
      - OPA_URL=http://opa:8181
      - OBJECT_STORE_ENDPOINT=http://object-storage:9000
      - OBJECT_STORE_BUCKET=trustcircle-evidence
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://collector:4317
      - COMPONENT_PROFILE=/app/deploy/profiles/components.yaml
      - RUNTIME_SET=core-required
      - BUNDLE_ID=36GCYGDJ15PTYP60F91QWRAY2M
      - BUNDLE_CONTENT_HASH=af120e10497d6ffe411b9756b3b341a5f812514c8ee10158c6dcd6e3298b014b

resources:
  - infrastructure.yaml
  - applications.yaml
