# Continuous delivery — builds the five application images after `verify` passes on the default
# branch (or on a version tag), pushes them to GitHub Container Registry, and optionally deploys
# to Kubernetes through scripts/provision.sh behind a protected environment.
#
# Deploy is OFF unless the repository variable DEPLOY_ENABLED is 'true' AND the `production`
# environment has a KUBECONFIG secret. Configure required reviewers on that environment so a human
# approves every deployment (separation of duties; ISO/IEC 42001 Annex A.6 change control).

name: delivery

on:
  workflow_run:
    workflows: [verify]
    types: [completed]
    branches: [wsl-updated, main]
  push:
    tags: ['v*.*.*']
  workflow_dispatch: {}

concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io/${{ github.repository_owner }}/trustcircle

jobs:
  images:
    name: images (${{ matrix.tier }})
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: true
      matrix:
        tier: [api, command-worker, projector, discovery-agent, web]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - id: meta
        name: Compute tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then tag="${GITHUB_REF#refs/tags/}"; else tag="$(git rev-parse --short=12 HEAD)"; fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/compose/Dockerfile
          target: ${{ matrix.tier }}
          push: true
          provenance: mode=max
          sbom: true
          tags: |
            ${{ env.REGISTRY }}/${{ matrix.tier }}:${{ steps.meta.outputs.tag }}
          cache-from: type=gha,scope=${{ matrix.tier }}
          cache-to: type=gha,mode=max,scope=${{ matrix.tier }}

  deploy:
    name: deploy (production)
    needs: images
    if: vars.DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Configure kubeconfig
        env:
          KUBECONFIG_DATA: ${{ secrets.KUBECONFIG }}
        run: |
          test -n "$KUBECONFIG_DATA" || { echo "::error::production environment has no KUBECONFIG secret"; exit 1; }
          mkdir -p ~/.kube && printf '%s' "$KUBECONFIG_DATA" > ~/.kube/config && chmod 600 ~/.kube/config
      - name: Restore instance secrets
        env:
          INSTANCE_ENV: ${{ secrets.TRUSTCIRCLE_ENV }}
        run: |
          test -n "$INSTANCE_ENV" || { echo "::error::production environment has no TRUSTCIRCLE_ENV secret"; exit 1; }
          mkdir -p .provision && umask 077 && printf '%s\n' "$INSTANCE_ENV" > .provision/kubernetes.env
      - name: Provision
        run: |
          scripts/provision.sh --target kubernetes --no-build \
            --registry "${REGISTRY}" --tag "${{ needs.images.outputs.tag }}" \
            --namespace "${{ vars.DEPLOY_NAMESPACE || 'trustcircle' }}"
      - name: Upload provisioning receipt
        uses: actions/upload-artifact@v4
        with:
          name: provisioning-receipt
          path: .provision/receipt-*.json
          retention-days: 400
